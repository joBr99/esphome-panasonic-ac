substitutions:
  device_name: cnt-test-ac
  wifi_ssid: "testwifi"
  wifi_pass: "test-password"
  ota_pw: "s0/blwvQQhhdnOzHqrbixA=="
  api_key: "5Vq+Zr3gQqy9+kDYvEE7ZhdWtYRlyekqfW/igr+QcrQ="

esphome:
  name: $device_name

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

wifi:
  ssid: $wifi_ssid
  password: $wifi_pass

api:
  encryption:
    key: $api_key

ota:
  - platform: esphome
    password: $ota_pw

logger:
  level: VERBOSE

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: EVEN

external_components:
  source:
    type: local
    path: components
  components: [panasonic_ac]

climate:
  - platform: panasonic_ac
    type: cnt
    name: "CNT Test AC"
    current_power_consumption:
      name: "CNT Estimated Power"
      id: ac_power

sensor:
  - platform: integration
    name: "CNT Estimated Energy"
    sensor: ac_power
    time_unit: h
    integration_method: left
    restore: true
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
